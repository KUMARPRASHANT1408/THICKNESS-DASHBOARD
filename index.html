<!DOCTYPE html>
<html lang="en">
<head>
    <!-- 
    ========================================================================
    RESTRICTED SYSTEM
    THIS FILE IS PROPERTY OF THE RELIABILITY & MAINTENANCE DEPARTMENT.
    ========================================================================
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>RTG Master Control Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --bg: #0f172a; --glass-base: rgba(30, 41, 59, 0.7); --glass-border: rgba(255, 255, 255, 0.1); --text-main: #f1f5f9; --text-muted: #94a3b8; --teal: #0d9488; --red: #e11d48; --blue: #3b82f6; --orange: #d97706; --green: #10b981; --purple: #8b5cf6; --slate: #64748b; --pink: #ec4899; --modal-bg: rgba(15, 23, 42, 0.95); }
        body.light-mode { --bg: #f8fafc; --glass-base: rgba(255, 255, 255, 0.9); --glass-border: rgba(0, 0, 0, 0.15); --text-main: #0f172a; --text-muted: #475569; --modal-bg: rgba(255, 255, 255, 0.95); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text-main); line-height: 1.5; transition: background-color 0.3s, color 0.3s; overflow-x: hidden;}
        button, .btn, .kpi-card, .action-icon, .ms-btn, .ms-opt, .tab-btn { touch-action: manipulation; }
        
        #loginScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: background-color 0.3s; }
        .login-box { background: var(--glass-base); border: 1px solid var(--glass-border); padding: 40px 20px; border-radius: 20px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.5); max-width: 500px; width: 90%; }
        .login-title { font-size: 2rem; font-weight: 800; color: var(--text-main); margin-bottom: 10px; }
        .login-subtitle { color: var(--text-muted); margin-bottom: 30px; font-size: 0.9rem; }
        .role-btn-container { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        .role-btn { padding: 15px 25px; border-radius: 12px; font-size: 1.1rem; font-weight: 700; cursor: pointer; border: none; display: flex; align-items: center; gap: 10px; transition: 0.3s; flex: 1; min-width: 200px; justify-content: center; color: white; position: relative; z-index: 10;}
        .role-btn-user { background: var(--blue); } .role-btn-admin { background: var(--teal); }
        .role-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 15px rgba(0,0,0,0.3); }
        .theme-toggle-top { position: absolute; top: 20px; right: 20px; z-index: 10000; padding: 10px 15px; border-radius: 8px; font-weight: bold; background: var(--slate); color: white; border: none; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3);}
        
        #mainDashboard { display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background: var(--glass-base); border-right: 1px solid var(--glass-border); display: flex; flex-direction: column; padding: 20px; position: fixed; height: 100vh; left: -260px; top: 0; z-index: 2000; transition: left 0.3s ease; backdrop-filter: blur(15px); }
        .sidebar.active { left: 0; box-shadow: 10px 0 30px rgba(0,0,0,0.5); }
        .sidebar-header { text-align: center; margin-bottom: 20px; border-bottom: 1px solid var(--glass-border); padding-bottom: 20px; position: relative; }
        .close-sidebar-btn { position: absolute; top: 0; right: 0; background: transparent; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }
        .sidebar-title { font-size: 1.4rem; font-weight: 800; color: var(--text-main); margin-top: 15px; letter-spacing: 0.5px; }
        .sidebar-menu { display: flex; flex-direction: column; gap: 12px; flex: 1; margin-top: 10px; }
        .sidebar-btn { background: rgba(148, 163, 184, 0.1); color: var(--text-main); padding: 15px; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 1rem; border: 1px solid transparent; transition: 0.2s; display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; }
        .sidebar-btn:hover { background: rgba(13, 148, 136, 0.2); border-color: var(--teal); color: var(--teal); transform: translateX(5px); }
        .sidebar-btn-red { color: var(--red); } .sidebar-btn-red:hover { background: rgba(225, 29, 72, 0.1); border-color: var(--red); color: var(--red); }
        
        .main-content { margin-left: 0; padding: 0 25px 25px 25px; flex: 1; max-width: 100%; }
        .menu-toggle { background: transparent; color: var(--text-main); border: none; font-size: 1.5rem; cursor: pointer; margin-right: 15px; transition: 0.2s; padding: 5px; }
        .menu-toggle:hover { color: var(--teal); transform: scale(1.1); }
        
        .conv-logo { position: relative; width: 80px; height: 26px; display: inline-block; vertical-align: middle; margin-right: 10px;}
        .conv-belt { position: absolute; top: 0; left: 0; width: 80px; height: 22px; border: 3px solid var(--text-main); border-radius: 12px; z-index: 2; box-sizing: border-box; overflow: hidden; box-shadow: 0 0 5px rgba(0,0,0,0.2); }
        .conv-belt::after { content: ''; position: absolute; top: -3px; left: 0; width: 200%; height: 24px; background: repeating-linear-gradient(90deg, transparent, transparent 15px, var(--teal) 15px, var(--teal) 20px); opacity: 0.5; animation: moveBelt 0.6s linear infinite; }
        .conv-pulley { position: absolute; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--bg); border: 2px solid var(--text-main); z-index: 1; animation: spin 1s linear infinite; }
        .conv-pulley.left { left: 4px; } .conv-pulley.right { right: 4px; }
        .conv-idler { position: absolute; bottom: 0px; width: 8px; height: 8px; border-radius: 50%; background: var(--teal); z-index: 3; animation: spin 1s linear infinite reverse;}
        .conv-idler.i1 { left: 24px; } .conv-idler.i2 { left: 36px; } .conv-idler.i3 { left: 48px; }
        @keyframes spin { 100% { transform: rotate(360deg); } } @keyframes moveBelt { 100% { transform: translateX(-15px); } }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; padding-top: 15px;}
        .header-title { font-size: 1.6rem; font-weight: 800; display: flex; align-items: center; color: var(--text-main); }
        
        .sticky-tabs { position: sticky; top: 0; z-index: 100; background: var(--bg); padding: 20px 0 10px 0; margin-bottom: 10px; border-bottom: 1px solid var(--glass-border); display: flex; gap: 10px; flex-wrap: wrap; transition: background-color 0.3s; }
        .sticky-kpi { position: sticky; top: 70px; z-index: 95; background: var(--bg); padding: 10px 0 5px 0; transition: background-color 0.3s; }
        
        .tab-btn { background: transparent; color: var(--text-muted); border: none; padding: 10px 20px; font-size: 1.05rem; font-weight: 700; cursor: pointer; border-radius: 8px; transition: 0.3s; }
        .tab-btn:hover { color: var(--text-main); background: rgba(148, 163, 184, 0.1); }
        .tab-btn.active { color: #fff; background: var(--teal); box-shadow: 0 4px 10px rgba(13, 148, 136, 0.3); }
        
        .ms-container { position: relative; width: 100%; max-width: 250px; display: inline-block;}
        .ms-btn { width: 100%; text-align: left; padding: 8px 15px; background: var(--glass-base); border: 1px solid var(--glass-border); color: var(--text-main); border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: 600;}
        .ms-dropdown { position: absolute; top: 100%; left: 0; width: 100%; background: var(--modal-bg); border: 1px solid var(--glass-border); border-radius: 8px; margin-top: 5px; max-height: 250px; overflow-y: auto; z-index: 1000; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.5); padding: 10px;}
        .ms-dropdown.show { display: block; }
        .ms-opt { display: flex; align-items: center; gap: 8px; padding: 10px 5px; cursor: pointer; color: var(--text-main); font-size: 0.95rem;}
        .ms-opt:hover { background: rgba(255,255,255,0.05); border-radius: 5px;}
        .ms-opt input[type="checkbox"] { cursor: pointer; width: 18px; height: 18px; accent-color: var(--teal);}
        .native-select { padding: 8px 15px; background: var(--glass-base); color: var(--text-main); border: 1px solid var(--glass-border); border-radius: 8px; outline: none; cursor: pointer; font-family: inherit; font-weight: 600; width: 100%; max-width: 200px;}
        .search-input { width: 160px; padding: 6px 12px; background: var(--glass-base); color: var(--text-main); border: 1px solid var(--glass-border); border-radius: 8px; font-family: inherit; outline: none;}
        .search-input:focus { border-color: var(--teal); }
        
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 5px; }
        .kpi-card { background: var(--glass-base); border: 1px solid var(--glass-border); padding: 15px 12px; border-radius: 12px; cursor: pointer; transition: 0.3s; position: relative; overflow: hidden; }
        .kpi-card:hover { transform: translateY(-3px); border-color: var(--teal); box-shadow: 0 8px 15px rgba(0,0,0,0.2); }
        .kpi-title { font-size: 0.7rem; text-transform: uppercase; color: var(--text-muted); font-weight: 800; letter-spacing: 0px;}
        .kpi-val { font-size: 1.6rem; font-weight: 800; margin-top: 5px; line-height: 1; color: var(--text-main); }
        .kpi-icon { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 1.5rem; opacity: 0.15; }
        
        .admin-kpi { background: linear-gradient(135deg, rgba(13, 148, 136, 0.15), rgba(59, 130, 246, 0.15)); border: 1px solid var(--teal); }
        .admin-kpi:hover { box-shadow: 0 8px 25px rgba(13, 148, 136, 0.4); transform: translateY(-5px); }
        
        .interactive-section { display: none; background: var(--glass-base); border: 1px solid var(--glass-border); padding: 20px; border-radius: 15px; margin-top: 20px; margin-bottom: 20px; position: relative; z-index: 10;}
        .charts-grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .charts-grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .chart-box { background: rgba(0,0,0,0.1); padding: 15px; border-radius: 12px; border: 1px solid var(--glass-border); }
        .chart-container { height: 280px; width: 100%; margin-top: 10px; }
        .chart-title { font-size: 0.95rem; font-weight: 700; color: var(--text-main); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;}
        
        .table-section-wrapper { scroll-margin-top: 180px; } 
        .table-container { max-height: 500px; overflow-x: auto; overflow-y: auto; margin-top: 15px; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.2);}
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; text-align: left; min-width: 1200px; }
        th { padding: 14px 12px; border-bottom: 2px solid var(--glass-border); color: var(--text-muted); position: sticky; top: 0; background: var(--bg); z-index: 10; font-weight: 800; white-space: nowrap; text-transform: uppercase; letter-spacing: 0.5px;}
        td { padding: 12px; border-bottom: 1px solid var(--glass-border); }
        tr:hover td { background: rgba(148, 163, 184, 0.1); }
        
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; }
        .badge-crit { background: rgba(225, 29, 72, 0.15); color: var(--red); border: 1px solid var(--red); }
        .badge-semi { background: rgba(217, 119, 6, 0.15); color: var(--orange); border: 1px solid var(--orange); }
        .badge-marg { background: rgba(59, 130, 246, 0.15); color: var(--blue); border: 1px solid var(--blue); }
        .badge-safe { background: rgba(16, 185, 129, 0.15); color: var(--green); border: 1px solid var(--green); }
        .count-badge { font-size: 0.85rem; color: #fff; background: var(--teal); padding: 3px 12px; border-radius: 12px; margin-left: 12px; vertical-align: middle; box-shadow: 0 2px 5px rgba(0,0,0,0.3);}
        
        .wear-loc { font-size: 0.75rem; color: #a855f7; display: block; margin-top: 3px; font-weight: 600; }
        .wear-cn { color: #0ea5e9; }
        .analysis-box { display: block; line-height: 1.3; }
        
        .alert-btn { background: linear-gradient(135deg, #f87171, #dc2626); color: white; padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; box-shadow: 0 4px 10px rgba(220, 38, 38, 0.3); transition: transform 0.2s, box-shadow 0.2s; border: none; text-transform: uppercase; }
        .alert-btn:hover { transform: scale(1.05); box-shadow: 0 6px 15px rgba(220, 38, 38, 0.5); }
        .btn-green { background: var(--teal); border: none; color: white; padding: 8px 15px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-green:hover { background: #0d9488; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(13,148,136,0.3); }
        .btn-slate { background: var(--slate); border: none; color: white; padding: 8px 15px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-slate:hover { background: #475569; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(71,85,105,0.3); }
        
        .action-icon { cursor: pointer; padding: 8px; border-radius: 4px; transition: 0.2s; font-size: 1.2rem; color: var(--purple);}
        .action-icon:hover { background: rgba(255,255,255,0.1); }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 10000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-content { background: var(--modal-bg); padding: 25px; border-radius: 15px; width: 95%; max-width: 800px; border: 1px solid var(--glass-border); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--glass-border); padding-bottom: 10px; }
        .close-btn { background: none; border: none; color: var(--red); font-size: 1.8rem; cursor: pointer; padding: 5px;}
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        #initial-message { text-align: center; padding: 80px 20px; color: var(--text-muted); font-size: 1.1rem; border: 1px dashed var(--glass-border); border-radius: 20px; margin-top: 40px;}
        
        /* CHATBOT */
        .chat-widget { position: fixed; bottom: 30px; right: 30px; z-index: 9999; }
        .chat-toggle { background: var(--teal); color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; cursor: pointer; box-shadow: 0 5px 15px rgba(13, 148, 136, 0.4); border: none; transition: 0.3s; }
        .chat-toggle:hover { transform: scale(1.1); }
        .chat-window { display: none; position: absolute; bottom: 75px; right: 0; width: 340px; height: 450px; background: var(--glass-base); border: 1px solid var(--glass-border); border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); flex-direction: column; overflow: hidden; backdrop-filter: blur(16px); }
        .chat-header { background: var(--bg); padding: 15px; border-bottom: 1px solid var(--glass-border); font-weight: 800; display: flex; align-items: center; gap: 10px; color: var(--text-main); }
        .bot-icon { width: 30px; height: 30px; background: var(--teal); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 0.9rem; }
        .chat-body { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: rgba(0,0,0,0.1); }
        .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 0.9rem; line-height: 1.4; word-wrap: break-word;}
        .msg-bot { background: var(--bg); color: var(--text-main); align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid var(--glass-border); }
        .msg-user { background: var(--teal); color: white; align-self: flex-end; border-bottom-right-radius: 2px; box-shadow: 0 2px 5px rgba(13, 148, 136, 0.3);}
        .chat-footer { padding: 10px; background: var(--bg); border-top: 1px solid var(--glass-border); display: flex; gap: 8px; }
        .chat-input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--glass-border); background: var(--glass-base); color: var(--text-main); outline: none; font-family: inherit;}
        .chat-input:focus { border-color: var(--teal); }
        .chat-send { background: var(--teal); border: none; width: 45px; border-radius: 8px; color: white; cursor: pointer; transition: 0.2s;}
        .chat-send:hover { background: #0d9488; filter: brightness(1.1); }
        
        @media (max-width: 768px) { .main-content { padding: 0 15px 15px 15px; } .header-title { font-size: 1.3rem; } }
    </style>
</head>
<body>
    <div id="loginScreen">
        <button class="btn btn-slate theme-toggle-top" onclick="toggleTheme()"><i class="fas fa-moon" id="loginThemeIcon"></i> Toggle Theme</button>
        <div class="login-box">
            <div style="margin-bottom: 25px;">
                <div class="conv-logo" style="width: 100px; height: 32px; margin: 0;">
                    <div class="conv-belt" style="width: 100px; height: 32px; border-radius: 16px;"></div>
                    <div class="conv-pulley left" style="width: 20px; height: 20px; top: 4px; left: 6px;"></div>
                    <div class="conv-idler i1" style="width: 10px; height: 10px; bottom: -2px; left: 30px;"></div>
                    <div class="conv-idler i2" style="width: 10px; height: 10px; bottom: -2px; left: 45px;"></div>
                    <div class="conv-idler i3" style="width: 10px; height: 10px; bottom: -2px; left: 60px;"></div>
                    <div class="conv-pulley right" style="width: 20px; height: 20px; top: 4px; right: 6px;"></div>
                </div>
            </div>
            <h1 class="login-title">RTG Master Control</h1>
            <p class="login-subtitle">Analytics & Maintenance Planning System</p>
            <div class="role-btn-container">
                <button type="button" class="role-btn role-btn-user" onclick="handleLogin('user')"><i class="fas fa-user"></i> Login as User</button>
                <button type="button" class="role-btn role-btn-admin" onclick="handleLogin('admin')"><i class="fas fa-user-shield"></i> Login as Admin</button>
            </div>
            <p style="margin-top:20px; font-size:0.75rem; color:var(--text-muted);">*User mode has restricted actions & view-only protection.</p>
        </div>
    </div>

    <!-- MAIN WRAPPER -->
    <div id="mainDashboard">
        <div class="sidebar" id="appSidebar">
            <button class="close-sidebar-btn" onclick="toggleSid
